name: CI

# Chạy cho mọi push/PR: lint + unit + e2e + build. Deploy KHÔNG nằm trong CI —
# deploy là hành động có chủ đích, cần secret Cloudflare, nên tách riêng.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # 1. Chất lượng mã nguồn: ESLint + Prettier (không cần browser).
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # 2. Unit test backend (Cloudflare Pages Functions) trên nhiều phiên bản Node.
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
        env:
          NODE_OPTIONS: --enable-source-maps

  # 3. E2E trong Chromium thật, trên server tĩnh (chế độ demo + backend giả lập).
  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # 4. Chốt chặn deploy: build ra dist/ sạch, Functions biên dịch được.
  build:
    name: Build & deploy readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Build dist/
        run: npm run build

      - name: Verify dist/ (không lẫn secret/tệp nội bộ)
        run: npm run verify:dist

      - name: Bundle Pages Functions (bắt lỗi import/cú pháp)
        run: npx wrangler pages functions build --outdir .wrangler/ci-functions

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
